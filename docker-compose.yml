version: "3.9"
services:
  webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - ./creds/garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://artifactory:3903"
      S3_ENDPOINT_URL: "http://artifactory:3900"
    depends_on:
      - artifactory

  artifactory:
    container_name: artifactory
    image: "dxflrs/garage:v2.1.0"
    restart: always
    ports:
      - 3902:3902
      - 3900:3900
    volumes:
      - ./creds/garage.toml:/etc/garage.toml
      - /mnt/pseudo_disk_0/garage/meta:/var/lib/garage/meta
      - /mnt/pseudo_disk_0/garage/data:/var/lib/garage/data

  prometheus:
    container_name: prometheus
    hostname: prometheus
    restart: always
    ports:
      - 9090:9090
    image: "prom/prometheus:v2.50.1"
    volumes:
      - prometheus-volume:/prometheus  # May be volume

  grafana:
    container_name: grafana
    hostname: grafana
    restart: always
    ports:
      - 3002:3000
    image: "grafana/grafana-oss:10.0.11"
    volumes:
        - /mnt/pseudo_disk_0/grafana:/var/lib/grafana

  jenkins:
    image: jenkins/jenkins:lts-latest
    container_name: jenkins-server
    restart: unless-stopped
    env_file: creds/creds.env
    build:
      context: .
      dockerfile: DockerfileJenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /mnt/pseudo_disk_0/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Mount socket

  gitlab:
    image: gitlab/gitlab-ce:17.6.5-ce.0
    container_name: gitlab
    restart: unless-stopped
    hostname: gitlab
    ports:
       - '8081:80'

    # environment:
    #   # Disable Puma
    #   GITLAB_OMNIBUS_CONFIG: |
    #     puma['enable'] = false
    #     # Enable other web server if needed
    #     # unicorn['enable'] = true  # GitLab < 14.0
    #     # gitlab_workhorse['enable'] = false
    volumes:
      - /mnt/pseudo_disk_0/gitlab_home/config:/etc/gitlab
      - /mnt/pseudo_disk_0/gitlab_home/logs:/var/log/gitlab
      - /mnt/pseudo_disk_0/gitlab_home/data:/var/opt/gitlab
    shm_size: '512m'
    logging:
      driver: "journald"

  # Pseudo Confluence and Jira

  redmine:
    image: redmine:6.0.4
    restart: always
    container_name: redmine
    env_file: creds/creds.env
    volumes:
      - /mnt/pseudo_disk_0/redmine-data:/usr/src/redmine/files
      - /mnt/pseudo_disk_0/redmine-logs:/var/log/redmine
    ports:
        - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "journald"

  postgres:
    image: postgres:17.2
    restart: always
    container_name: postgres
    env_file: creds/creds.env
    volumes:
      - /mnt/pseudo_disk_0/redmine-postgresql-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  openproject:
    image: openproject/openproject:15 #user/password by default admin/admin
    container_name: openproject
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - OPENPROJECT_HOST__NAME=localhost:8082
      - OPENPROJECT_HTTPS=false
      - OPENPROJECT_DEFAULT__LANGUAGE=ru
      - OPENPROJECT_RAILS__RELATIVE__URL__ROOT=
      - OPENPROJECT_PORT=8080
    volumes:
      - openproject-pg-data:/var/lib/postgresql/9.6/main
      - openproject-assets:/var/openproject/assets
    networks:
      - default

# The administration application is not installed. Since XWiki Enterprise 1.5, the Administration is distributed as an application. 
# You can download it from http://extensions.xwiki.org/xwiki/bin/view/Extension/Administration+Application.

  xwiki:
    image: xwiki:stable-postgres-tomcat
    container_name: xwiki
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - DB_USER=xwiki
      - DB_PASSWORD=xwiki
      - DB_DATABASE=xwiki
      - DB_HOST=postgres
      - DB_DBMS=postgresql
    volumes:
      - xwiki-data:/usr/local/xwiki
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

      # Got to db and create user, password and db for XWiki
      # From host and `dev-infra` folder
      # docker exec -it postgres bash
      # root@4afe81541434:/# su postgres
      # postgres@4afe81541434:/$ psql
      # postgres@4afe81541434:/$ psql -U redmine
      # psql (17.2 (Debian 17.2-1.pgdg120+1))
      # Type "help" for help.

      # redmine=# CREATE USER xwiki WITH PASSWORD 'xwiki';
      # CREATE ROLE
      # redmine=# CREATE DATABASE xwiki;
      # CREATE DATABASE
      # redmine=# GRANT ALL PRIVILEGES ON DATABASE xwiki TO xwiki;
      # GRANT
      # redmine=# 

# Warning! docker-compose down looks like remove volumes
volumes:
  prometheus-volume:
  openproject-pg-data:
  openproject-assets:
  xwiki-data: